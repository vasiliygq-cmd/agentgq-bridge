<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>AgentGQ Bridge Test</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19212c;background:#fff}
    body{margin:0;padding:18px;line-height:1.45}
    h1{font-size:18px;margin:0 0 10px}p{font-size:13px;margin:8px 0}
    button{background:#173d7a;color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}
    #status{padding:10px;border-radius:8px;background:#f2f5f8}
    #status.error{background:#fff0ef;color:#a11a14}#status.ok{background:#eff8f2;color:#176334}
    #metadata{font-size:12px;color:#586575;overflow-wrap:anywhere;margin-top:12px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto;background:#f5f6f8;border:1px solid #e2e5e9;border-radius:8px;padding:12px;font-size:12px}
    .notice{font-size:12px;color:#536170}
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <h1>AgentGQ Bridge — тест</h1>
  <p class="notice">Проверка доступа к одному открытому письму. Письмо отображается только в этой панели и никуда не передаётся.</p>
  <p id="status">Инициализация Office.js…</p>
  <button id="read" type="button" disabled>Прочитать открытое письмо</button>
  <div id="metadata"></div>
  <pre id="result">После нажатия здесь появится текст письма.</pre>
  <script src="./taskpane.js"></script>
</body>
</html>
